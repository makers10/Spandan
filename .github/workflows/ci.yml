name: Spandan CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Run Automated Test Suites & Typecheck
    runs-on: ubuntu-latest # Free tier GitHub Actions runner
    timeout-minutes: 15

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: 🧪 Run Automated Security & Math Tests (All 30 Suites)
        run: npm test

      - name: 🔍 TypeScript Typecheck
        run: npx tsc --noEmit
